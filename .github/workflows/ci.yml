name: CI

on:
  push:
    branches:
      [main, codex/phase-3-opportunity-resolution, codex/phase-4-rules-eligibility-evaluation, codex/phase-5-public-trust-layer, codex/phase-6-profile-match-personal-action, codex/phase-7-feedback-review-validation, codex/phase-8-deadline-change-reminders]
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_DB: deepaha
          POSTGRES_USER: deepaha
          POSTGRES_PASSWORD: deepaha_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepaha -d deepaha"
          --health-interval 2s --health-timeout 2s --health-retries 30
      s3:
        image: motoserver/moto:5.2.2
        ports: ["5000:5000"]
    # Test-only constants for disposable local service containers; not external secrets.
    env:
      DEEPAHA_DATABASE_URL: postgresql+psycopg://deepaha:deepaha_local_only@127.0.0.1:5432/deepaha
      DEEPAHA_OBJECT_STORE_ENDPOINT: http://127.0.0.1:5000
      DEEPAHA_OBJECT_STORE_REGION: us-east-1
      DEEPAHA_OBJECT_STORE_BUCKET: deepaha-raw
      DEEPAHA_OBJECT_STORE_ACCESS_KEY: phase1-ci
      DEEPAHA_OBJECT_STORE_SECRET_KEY: phase1-ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration --strict-markers
      - run: >-
          uv run pytest tests/contracts tests/sources tests/documents
          -m "not integration and not live_source" --strict-markers
      - run: uv run alembic check

  phase3-resolution:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_DB: deepaha
          POSTGRES_USER: deepaha
          POSTGRES_PASSWORD: deepaha_phase3_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepaha -d deepaha"
          --health-interval 2s --health-timeout 2s --health-retries 30
      s3:
        image: motoserver/moto:5.2.2
        ports: ["5000:5000"]
    # Test-only constants for disposable CI services; never valid outside this job.
    env:
      DEEPAHA_DATABASE_URL: postgresql+psycopg://deepaha:deepaha_phase3_local_only@127.0.0.1:5432/deepaha
      DEEPAHA_OBJECT_STORE_ENDPOINT: http://127.0.0.1:5000
      DEEPAHA_OBJECT_STORE_REGION: us-east-1
      DEEPAHA_OBJECT_STORE_BUCKET: deepaha-raw
      DEEPAHA_OBJECT_STORE_ACCESS_KEY: phase3-ci
      DEEPAHA_OBJECT_STORE_SECRET_KEY: phase3-ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run alembic upgrade head
      - run: uv run pytest -m integration --strict-markers
      - run: >-
          uv run pytest tests/contracts tests/opportunities
          -m "not integration and not live_source" --strict-markers
      - run: uv run alembic check

  phase4-eligibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_DB: deepaha
          POSTGRES_USER: deepaha
          POSTGRES_PASSWORD: deepaha_phase4_local_only
        ports: ["55434:5432"]
        options: >-
          --health-cmd "pg_isready -U deepaha -d deepaha"
