      DEEPAHA_DATABASE_URL: postgresql+psycopg://deepaha:deepaha_phase4_local_only@127.0.0.1:55434/deepaha
      DEEPAHA_OBJECT_STORE_ENDPOINT: http://127.0.0.1:55002
      DEEPAHA_OBJECT_STORE_REGION: us-east-1
      DEEPAHA_OBJECT_STORE_BUCKET: deepaha-raw
      DEEPAHA_OBJECT_STORE_ACCESS_KEY: phase4-ci
      DEEPAHA_OBJECT_STORE_SECRET_KEY: phase4-ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: >-
          uv run pytest tests/contracts/test_phase4_contracts.py tests/rules
          tests/eligibility tests/evaluation tests/test_phase4_verifier_scope.py
          --strict-markers
      - run: uv run alembic upgrade head
      - run: >-
          uv run pytest -m integration
          tests/integration/test_phase4_persistence_contract.py
          tests/integration/test_phase4_match_replay.py
          tests/integration/test_phase4_evaluation_run.py
          --strict-markers
      - run: uv run alembic downgrade 20260822_0003
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  phase5-public-trust:
