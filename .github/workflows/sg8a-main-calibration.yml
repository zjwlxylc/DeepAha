name: SG8-A main calibration

on:
  push:
    branches:
      - gpt/sg8a-main-calibration
    paths:
      - ".sg8a-calibration/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/sg8a-main-calibration
          fetch-depth: 0
      - name: Reconstruct verified SG8-A payload
        shell: bash
        run: |
          set -euo pipefail
          cat .sg8a-calibration/chunk-*.b64 > /tmp/sg8a.b64
          base64 -d /tmp/sg8a.b64 > /tmp/sg8a.tar.xz
          echo "45d03867ca95f7def31f4198bc3a869b483e9f7a962e6e2f83a25d302cfdb470  /tmp/sg8a.tar.xz" | sha256sum -c -
          mkdir -p /tmp/sg8a
          tar -xJf /tmp/sg8a.tar.xz -C /tmp/sg8a
      - name: Overlay SG8-A runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          rsync -a /tmp/sg8a/ ./
          rm -f backend/uv.lock web/pnpm-lock.yaml
          rm -rf .sg8a-calibration
          rm -f .github/workflows/sg8a-main-calibration.yml
          git status --short
      - name: Commit calibrated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "DeepAha Baseline Calibration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: calibrate source baseline to SG8-A 3.8.0-rc1"
          git push origin HEAD:gpt/sg8a-main-calibration
