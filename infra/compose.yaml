# Production configuration template. NOT validated against a running Docker/PostgreSQL host in this delivery.
# Explicit init/setup is required; no automatic migrations, passwords, sample imports or approval.
name: deepaha-product
x-app: &app
  build:
    context: ..
    dockerfile: infra/product/Dockerfile
    args:
      WITH_WMA: ${DEEPAHA_WITH_WMA:-0}
  env_file: .env
  environment:
    DEEPAHA_DATA_DIR: /var/lib/deepaha
  volumes:
    - objects:/var/lib/deepaha
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepaha}
      POSTGRES_USER: ${POSTGRES_USER:-deepaha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password in infra/.env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    profiles: [wma]
    command: ["python", "-m", "deepaha.product.cli", "worker"]
volumes:
  database:
  objects:
