services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: deepaha
      POSTGRES_USER: deepaha
      POSTGRES_PASSWORD: deepaha_local_manual_only
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql:rw,noexec,nosuid,size=512m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepaha -d deepaha"]
      interval: 2s
      timeout: 2s
      retries: 30

  s3:
    image: motoserver/moto:5.2.2
    ports:
      - "127.0.0.1:55007:5000"
