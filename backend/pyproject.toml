[project]
name = "deepaha-product"
version = "3.8.0rc1"
description = "DeepAha opportunity intake, overall review and personal actions"
requires-python = ">=3.13,<3.15"
dependencies = ["fastapi==0.128.2", "starlette==0.50.0", "uvicorn==0.48.0", "SQLAlchemy==2.0.50", "pydantic==2.13.4", "httpx==0.28.1", "cryptography==46.0.4", "psutil==7.2.2", "tzdata==2026.2", "openpyxl>=3.1.5,<4", "pypdf>=6,<7"]

[project.optional-dependencies]
wma = ["codebuddy-cloud-agent-sdk==0.3.4"]
postgres = ["psycopg[binary]>=3.2,<4"]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "playwright==1.57.0"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests/product"]
markers = ["integration: isolated external infrastructure", "live_source: explicit live authorization only"]

[tool.ruff]
line-length = 100
target-version = "py313"
