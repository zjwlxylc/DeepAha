[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "deepaha-membership"
version = "0.1.0"
description = "Additive subscription and source-contribution module; not a complete Mobile R2 distribution"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "sqlalchemy>=2,<3", "uvicorn>=0.30,<1", "pydantic>=2,<3", "tzdata>=2024.1"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
deepaha_membership = ["static/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
